<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - TokoKita</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">
    <!-- Navbar -->
    <nav class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 flex justify-between items-center h-16">
            <a href="index.html" class="text-2xl font-extrabold text-blue-600">TokoKita</a>
            <div class="hidden md:flex space-x-6 font-medium text-gray-700">
                <a href="index.html" class="hover:text-blue-600">Beranda</a>
                <a href="katalog.html" class="hover:text-blue-600">Katalog</a>
                <a href="detail.html" class="hover:text-blue-600">Detail Produk</a>
                <a href="keranjang.html" class="hover:text-blue-600">Keranjang</a>
                <a href="checkout.html" class="text-blue-600">Checkout</a>
            </div>
            <a href="login.html" class="text-sm font-semibold text-gray-600 hover:text-red-500">Keluar</a>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-4 py-8 w-full flex-grow">
        <h1 class="text-3xl font-extrabold text-gray-800 mb-6">Formulir Checkout</h1>

        <form action="#" onsubmit="alert('Pesanan Berhasil Dibuat!'); window.location.href='index.html'; return false;" class="bg-white p-6 rounded-xl border shadow-sm space-y-6">
            <div>
                <h3 class="font-bold text-lg text-gray-800 mb-4">Informasi Pengiriman</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" placeholder="Nama Lengkap" required class="px-4 py-2 border rounded-lg w-full focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <input type="tel" placeholder="Nomor Telepon" required class="px-4 py-2 border rounded-lg w-full focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <textarea placeholder="Alamat Lengkap" rows="3" required class="mt-4 px-4 py-2 border rounded-lg w-full focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
            </div>

            <div>
                <h3 class="font-bold text-lg text-gray-800 mb-4">Metode Pembayaran</h3>
                <div class="space-y-2">
                    <label class="flex items-center p-3 border rounded-lg cursor-pointer hover:bg-gray-50">
                        <input type="radio" name="payment" checked class="text-blue-600">
                        <span class="ml-3 font-medium text-gray-700">Transfer Bank (BCA / Mandiri)</span>
                    </label>
                    <label class="flex items-center p-3 border rounded-lg cursor-pointer hover:bg-gray-50">
                        <input type="radio" name="payment" class="text-blue-600">
                        <span class="ml-3 font-medium text-gray-700">E-Wallet (Gopay / OVO)</span>
                    </label>
                </div>
            </div>

            <div class="pt-4 border-t flex justify-between items-center">
                <div>
                    <span class="text-sm text-gray-500 block">Total Pembayaran</span>
                    <span class="text-2xl font-extrabold text-blue-600">Rp 770.000</span>
                </div>
                <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-bold px-8 py-3 rounded-lg shadow-md transition">
                    Konfirmasi & Bayar
                </button>
            </div>
        </form>
    </div>

    <footer class="bg-white border-t py-6 text-center text-gray-500 text-sm mt-auto">
        &copy; 2026 TokoKita. Hak Cipta Dilindungi.
    </footer>
</body>
</html>
