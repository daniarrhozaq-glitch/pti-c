<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TokoKita</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="halaman-login">
    <div class="kontainer-login">
        <div class="header-login">
            <h1 class="logo-toko-login">TokoKita</h1>
            <p class="subjudul-login">Selamat datang kembali! Silakan login.</p>
        </div>
        
        <!-- Form Login -->
        <form id="loginForm" class="formulir-login">
            <div class="grup-input">
                <label for="username" class="label-input">Username</label>
                <input type="text" id="username" class="field-input" required placeholder="Masukkan username">
            </div>
            <div class="grup-input">
                <label for="password" class="label-input">Password</label>
                <input type="password" id="password" class="field-input" required placeholder="Masukkan password">
            </div>
            
            <!-- Pesan Error / Gagal Login -->
            <p id="error-message" class="pesan-error"></p>

            <button type="submit" class="tombol-login">
                Masuk Ke Akun
            </button>
        </form>
    </div>

    <!-- JavaScript Eksternal -->
    <script src="script.js"></script>
</body>
</html>
