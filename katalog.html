<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog - TokoKita</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="halaman-katalog">
    <!-- Navigasi Utama -->
    <nav class="bilah-navigasi">
        <div class="kontainer-navigasi">
            <a href="index.html" class="logo-toko">TokoKita</a>
            <div class="menu-navigasi">
                <a href="index.html" class="tautan-navigasi">Beranda</a>
                <a href="katalog.html" class="tautan-aktif">Katalog</a>
                <a href="detail.html" class="tautan-navigasi">Detail Produk</a>
                <a href="keranjang.html" class="tautan-navigasi">Keranjang</a>
                <a href="checkout.html" class="tautan-navigasi">Checkout</a>
            </div>
            <a href="login.html" class="tombol-keluar">Keluar</a>
        </div>
    </nav>

    <div class="kontainer-utama">
        <h1 class="judul-halaman">Katalog Produk</h1>
        
        <!-- Filter & Pencarian -->
        <div class="area-filter-pencarian">
            <input type="text" placeholder="Cari produk..." class="input-pencarian">
            <select class="pilih-kategori">
                <option>Semua Kategori</option>
                <option>Elektronik</option>
                <option>Fashion</option>
                <option>Aksesoris</option>
            </select>
        </div>

        <!-- Grid Produk -->
        <div class="kisi-katalog-produk">
            <div class="kartu-produk">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400" class="gambar-produk" alt="Headphone">
                <span class="label-kategori">Elektronik</span>
                <h3 class="nama-produk">Headphone Wireless</h3>
                <p class="harga-produk">Rp 750.000</p>
                <a href="detail.html" class="tombol-detail">Beli Sekarang</a>
            </div>
            <div class="kartu-produk">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400" class="gambar-produk" alt="Jam">
                <span class="label-kategori">Aksesoris</span>
                <h3 class="nama-produk">Jam Tangan Smartwatch</h3>
                <p class="harga-produk">Rp 1.200.000</p>
                <a href="detail.html" class="tombol-detail">Beli Sekarang</a>
            </div>
        </div>
    </div>

    <!-- Catatan Kaki / Footer -->
    <footer class="bagian-footer">
        &copy; 2026 TokoKita. Hak Cipta Dilindungi.
    </footer>
</body>
</html>
