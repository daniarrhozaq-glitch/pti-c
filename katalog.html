<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog - TokoKita</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">
    <!-- Navbar -->
    <nav class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 flex justify-between items-center h-16">
            <a href="index.html" class="text-2xl font-extrabold text-blue-600">TokoKita</a>
            <div class="hidden md:flex space-x-6 font-medium text-gray-700">
                <a href="index.html" class="hover:text-blue-600">Beranda</a>
                <a href="katalog.html" class="text-blue-600">Katalog</a>
                <a href="detail.html" class="hover:text-blue-600">Detail Produk</a>
                <a href="keranjang.html" class="hover:text-blue-600">Keranjang</a>
                <a href="checkout.html" class="hover:text-blue-600">Checkout</a>
            </div>
            <a href="login.html" class="text-sm font-semibold text-gray-600 hover:text-red-500">Keluar</a>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow">
        <h1 class="text-3xl font-extrabold text-gray-800 mb-6">Katalog Produk</h1>
        
        <!-- Filter & Search -->
        <div class="flex flex-col md:flex-row gap-4 mb-8">
            <input type="text" placeholder="Cari produk..." class="flex-grow px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <select class="px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                <option>Semua Kategori</option>
                <option>Elektronik</option>
                <option>Fashion</option>
            </select>
        </div>

        <!-- Grid Produk -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="bg-white rounded-xl shadow-sm border p-4 hover:shadow-md transition">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400" class="w-full h-48 object-cover rounded-lg mb-4" alt="Headphone">
                <span class="text-xs bg-blue-100 text-blue-600 px-2 py-1 rounded font-semibold">Elektronik</span>
                <h3 class="font-bold text-gray-800 mt-2">Headphone Wireless</h3>
                <p class="text-blue-600 font-extrabold mt-1">Rp 750.000</p>
                <a href="detail.html" class="mt-4 block text-center bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg text-sm font-semibold">Beli Sekarang</a>
            </div>
            <div class="bg-white rounded-xl shadow-sm border p-4 hover:shadow-md transition">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400" class="w-full h-48 object-cover rounded-lg mb-4" alt="Jam">
                <span class="text-xs bg-blue-100 text-blue-600 px-2 py-1 rounded font-semibold">Aksesoris</span>
                <h3 class="font-bold text-gray-800 mt-2">Jam Tangan Smartwatch</h3>
                <p class="text-blue-600 font-extrabold mt-1">Rp 1.200.000</p>
                <a href="detail.html" class="mt-4 block text-center bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg text-sm font-semibold">Beli Sekarang</a>
            </div>
        </div>
    </div>

    <footer class="bg-white border-t py-6 text-center text-gray-500 text-sm mt-auto">
        &copy; 2026 TokoKita. Hak Cipta Dilindungi.
    </footer>
</body>
</html>
