<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keranjang - TokoKita</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">TokoKita</a>
            <div class="nav-menu">
                <a href="index.html">Beranda</a>
                <a href="katalog.html">Katalog</a>
                <a href="detail.html">Detail Produk</a>
                <a href="keranjang.html" class="active">Keranjang</a>
                <a href="checkout.html">Checkout</a>
            </div>
            <a href="login.html" class="nav-logout">Keluar</a>
        </div>
    </nav>

    <div class="main-container">
        <h1 class="page-title">Keranjang Belanja</h1>
        
        <div class="cart-grid">
            <div class="cart-items">
                <div class="cart-card">
                    <div class="item-info">
                        <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=100" class="item-img" alt="Headphone">
                        <div>
                            <h4>Headphone Wireless</h4>
                            <!-- Harga satuan diberi atribut data-price -->
                            <p class="item-price" data-price="750000">Rp 750.000</p>
                        </div>
                    </div>
                    <div class="item-action">
                        <!-- Input jumlah barang -->
                        <input type="number" id="qty" value="1" min="1" class="qty-input">
                        <button class="btn-delete">Hapus</button>
                    </div>
                </div>
            </div>

            <!-- Ringkasan Harga -->
            <div class="summary-card">
                <h3>Ringkasan Pesanan</h3>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal">Rp 750.000</span>
                </div>
                <div class="summary-row">
                    <span>Pengiriman</span>
                    <span id="shipping">Rp 20.000</span>
                </div>
                <hr>
                <div class="summary-row total-row">
                    <span>Total</span>
                    <span id="total" class="total-price">Rp 770.000</span>
                </div>
                <a href="checkout.html" class="btn-checkout">
                    Lanjut ke Checkout
                </a>
            </div>
        </div>
    </div>

    <footer class="footer">
        &copy; 2026 TokoKita. Hak Cipta Dilindungi.
    </footer>

    <!-- JavaScript Eksternal untuk Kalkulasi Harga -->
    <script src="cart.js"></script>
</body>
</html>
