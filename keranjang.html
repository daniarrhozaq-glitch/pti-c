<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keranjang - TokoKita</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="halaman-keranjang">
    <!-- Navigasi Utama -->
    <nav class="bilah-navigasi">
        <div class="kontainer-navigasi">
            <a href="index.html" class="logo-toko">TokoKita</a>
            <div class="menu-navigasi">
                <a href="index.html" class="tautan-navigasi">Beranda</a>
                <a href="katalog.html" class="tautan-navigasi">Katalog</a>
                <a href="detail.html" class="tautan-navigasi">Detail Produk</a>
                <a href="keranjang.html" class="tautan-aktif">Keranjang</a>
                <a href="checkout.html" class="tautan-navigasi">Checkout</a>
            </div>
            <a href="login.html" class="tombol-keluar">Keluar</a>
        </div>
    </nav>

    <div class="kontainer-utama">
        <h1 class="judul-halaman">Keranjang Belanja</h1>
        
        <div class="kisi-keranjang">
            <div class="daftar-item-keranjang">
                <div class="kartu-item-keranjang">
                    <div class="informasi-item">
                        <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=100" class="gambar-item" alt="Headphone">
                        <div>
                            <h4 class="nama-item">Headphone Wireless</h4>
                            <!-- Harga satuan diberi atribut data-price -->
                            <p class="harga-item" data-price="750000">Rp 750.000</p>
                        </div>
                    </div>
                    <div class="aksi-item">
                        <!-- Input jumlah barang -->
                        <input type="number" id="qty" value="1" min="1" class="input-jumlah">
                        <button class="tombol-hapus">Hapus</button>
                    </div>
                </div>
            </div>

            <!-- Ringkasan Harga -->
            <div class="kartu-ringkasan">
                <h3 class="judul-ringkasan">Ringkasan Pesanan</h3>
                <div class="baris-ringkasan">
                    <span>Subtotal</span>
                    <span id="subtotal">Rp 750.000</span>
                </div>
                <div class="baris-ringkasan">
                    <span>Pengiriman</span>
                    <span id="shipping">Rp 20.000</span>
                </div>
                <hr class="pemisah-ringkasan">
                <div class="baris-ringkasan baris-total">
                    <span>Total</span>
                    <span id="total" class="harga-total">Rp 770.000</span>
                </div>
                <a href="checkout.html" class="tombol-checkout">
                    Lanjut ke Checkout
                </a>
            </div>
        </div>
    </div>

    <!-- Catatan Kaki / Footer -->
    <footer class="bagian-footer">
        &copy; 2026 TokoKita. Hak Cipta Dilindungi.
    </footer>

    <!-- JavaScript Eksternal untuk Kalkulasi Harga -->
    <script src="cart.js"></script>
</body>
</html>
